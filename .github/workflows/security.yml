name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm-audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: npm audit (solo informativo, no bloquea)
        run: npm audit --audit-level=critical || true

      - name: Verificar vulnerabilidades críticas
        run: |
          CRITICAL=$(npm audit --json 2>/dev/null | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');try{const j=JSON.parse(d);const c=Object.values(j.vulnerabilities||{}).filter(v=>v.severity==='critical').length;console.log(c)}catch{console.log(0)}")
          echo "Vulnerabilidades críticas: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then exit 1; fi

  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
