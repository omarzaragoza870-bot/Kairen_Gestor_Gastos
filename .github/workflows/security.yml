name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm-audit:
    name: Auditoría de dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Falla el workflow si hay vulnerabilidades HIGH o CRITICAL sin resolver
      # Las 3 moderate de uuid (dentro de @capacitor/cli) no se pueden resolver
      # sin bajar la versión de Capacitor — se aceptan conscientemente.
      - name: npm audit (bloquea en HIGH/CRITICAL)
        run: npm audit --audit-level=high

  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}