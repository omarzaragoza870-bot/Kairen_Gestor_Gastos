name: Build APK Debug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    # El .env no se sube a GitHub (está en .gitignore), así que el build del
    # APK toma estas variables de los secrets del repositorio. Sin ellas,
    # la app se compila sin la dirección de Supabase y se queda en negro.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Verificar variables de Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "Variables de Supabase presentes."

      - name: Checkout código
        uses: actions/checkout@v5

      # Capacitor 8 / Android Gradle Plugin requieren JDK 21 (con 17 falla la compilación)
      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Capacitor 8 requiere Node.js 22 o superior (con 20 falla `cap sync`)
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # Busca el APK generado sin depender de su nombre exacto
      - name: Localizar APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No se generó ningún APK" && exit 1; fi
          echo "Encontrado: $APK ($(du -h "$APK" | cut -f1))"
          echo "ruta=$APK" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: KairenFinanzas-debug
          path: ${{ steps.apk.outputs.ruta }}
          if-no-files-found: error
          retention-days: 7